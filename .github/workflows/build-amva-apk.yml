name: Build AMVA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AMVA-Associacao-Master-Vale-do-Aco.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMVA-Associacao-Master-Vale-do-Aco
          path: AMVA-Associacao-Master-Vale-do-Aco.apk

# AMVA V55 build trigger
