name: Build AMVA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract AMVA project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'AMVA_Android_APK_PROJETO.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP do projeto não encontrado."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo "Projeto extraído:"
          find project -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMVA-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
